[workspace]
resolver = "2"
members = [
    "nexus-core",
    "nexus-crypto",
    "nexus-anchor",
    "nexus-active",
    "nexus-sentinel",
    "nexus-zk",
    "nexus-network",
    "nexus-node",
    "nexus-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Juan Diego Susunaga Velasquez"]
license = "MIT"
repository = "https://github.com/JuanDiegoSusunaga/nexus"
description = "NEXUS Dual-Chain: Post-Quantum Secure Banking Blockchain Architecture"

[workspace.dependencies]
# Core
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
bytes = "1.5"
hex = "0.4"

# Cryptography
sha3 = "0.10"
blake3 = "1.5"
rand = "0.8"
rand_chacha = "0.3"
zeroize = { version = "1.7", features = ["derive"] }

# Post-Quantum Cryptography (FIPS 204 ML-DSA — pure Rust, seed-based KeyGen)
fips204 = "0.4"

# Zero-Knowledge Proofs
ark-ff = "0.4"
ark-ec = "0.4"
ark-serialize = "0.4"
ark-std = "0.4"
ark-bn254 = "0.4"
ark-groth16 = "0.4"
ark-snark = "0.4"
ark-relations = "0.4"
ark-r1cs-std = "0.4"

# Networking
libp2p = { version = "0.53", features = ["tokio", "tcp", "noise", "yamux", "gossipsub", "kad", "identify"] }

# Storage
rocksdb = "0.22"
sled = "0.34"

# Misc
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
clap = { version = "4.4", features = ["derive"] }
config = "0.14"
dashmap = "5.5"
parking_lot = "0.12"
rayon = "1.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
