[package]
name = "nexus-crypto"
description = "Post-Quantum Cryptography core for NEXUS blockchain (CRYSTALS-Dilithium / ML-DSA FIPS 204, active key lifecycle)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
nexus-core = { path = "../nexus-core" }

# PQC Libraries (FIPS 204 ML-DSA — pure Rust, deterministic seed-based KeyGen)
fips204.workspace = true

# Standard crypto
sha3.workspace = true
blake3.workspace = true
rand.workspace = true
rand_chacha.workspace = true
zeroize.workspace = true

# Utilities
thiserror.workspace = true
serde.workspace = true
bincode.workspace = true
hex.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
criterion = "0.5"
# Líneas base clásicas para la comparativa del Objetivo 4 (Act 4.2)
p256 = { version = "0.13", features = ["ecdsa"] }
rsa = { version = "0.9", features = ["sha2"] }

[[bench]]
name = "dilithium_bench"
harness = false

[[bench]]
name = "classical_baseline"
harness = false
